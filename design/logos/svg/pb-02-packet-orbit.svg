<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 02 环绕投递 — host package at center, device dots orbiting (LAN peers) -->
  <g fill="currentColor">
    <!-- host package -->
    <rect x="42" y="42" width="16" height="16" rx="3.5"/>
    <!-- inner ring: 6 device dots -->
    <circle cx="50" cy="30" r="3"/>
    <circle cx="67.3" cy="34" r="3"/>
    <circle cx="71" cy="51" r="3"/>
    <circle cx="58.6" cy="66" r="3"/>
    <circle cx="41.4" cy="66" r="3"/>
    <circle cx="29" cy="51" r="3"/>
  </g>
  <!-- outer partial ring (open bottom = harbor mouth) -->
  <path d="M 28 42 A 24 24 0 1 1 72 42"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" opacity="0.45"/>
  <!-- connection hint: short radial ticks toward host -->
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.35">
    <line x1="50" y1="34" x2="50" y2="40"/>
    <line x1="63" y1="38" x2="58" y2="44"/>
    <line x1="66" y1="50" x2="60" y2="50"/>
  </g>
</svg>
