<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 07 投递落坞 — package + delivery drop + harbor berth (core product metaphor) -->
  <g fill="currentColor">
    <!-- package body -->
    <rect x="32" y="28" width="36" height="30" rx="4"/>
    <!-- package belt -->
    <rect x="32" y="40" width="36" height="5" opacity="0.35"/>
    <!-- vertical strap -->
    <rect x="47" y="28" width="6" height="30" opacity="0.35"/>
  </g>
  <!-- drop path -->
  <path d="M 50 62 L 50 74"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        opacity="0.5" fill="none"/>
  <!-- berth / dock receiving plate -->
  <path d="M 28 76 L 72 76 L 66 86 L 34 86 Z" fill="currentColor"/>
  <!-- pier flanks -->
  <g fill="currentColor" opacity="0.45">
    <rect x="20" y="52" width="6" height="34" rx="1.5"/>
    <rect x="74" y="52" width="6" height="34" rx="1.5"/>
  </g>
  <!-- water dots -->
  <g fill="currentColor" opacity="0.25">
    <circle cx="36" cy="92" r="1.6"/>
    <circle cx="50" cy="92" r="1.6"/>
    <circle cx="64" cy="92" r="1.6"/>
  </g>
</svg>
