<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 06 分块封印 — hex frame + chunk grid (block upload / SHA-256 integrity) -->
  <defs>
    <polygon id="pb06-cell" points="0,-4.2 3.64,-2.1 3.64,2.1 0,4.2 -3.64,2.1 -3.64,-2.1"/>
  </defs>
  <!-- outer hex (stroke) -->
  <polygon points="50,18 77.7,34 77.7,66 50,82 22.3,66 22.3,34"
           fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  <!-- inner hex cells: 7-chunk honeycomb -->
  <g fill="currentColor">
    <use href="#pb06-cell" x="50" y="42"/>
    <use href="#pb06-cell" x="42" y="46.2"/>
    <use href="#pb06-cell" x="58" y="46.2"/>
    <use href="#pb06-cell" x="42" y="54.2"/>
    <use href="#pb06-cell" x="58" y="54.2"/>
    <use href="#pb06-cell" x="50" y="58.4"/>
  </g>
  <!-- verified center cell (heavier) -->
  <use href="#pb06-cell" x="50" y="50.2" fill="currentColor" opacity="0.35"/>
  <circle cx="50" cy="50.2" r="3.2" fill="currentColor"/>
  <!-- corner marks: atomic commit ticks -->
  <g fill="currentColor" opacity="0.4">
    <rect x="24" y="30" width="4" height="4" rx="1"/>
    <rect x="72" y="30" width="4" height="4" rx="1"/>
    <rect x="24" y="66" width="4" height="4" rx="1"/>
    <rect x="72" y="66" width="4" height="4" rx="1"/>
  </g>
</svg>
