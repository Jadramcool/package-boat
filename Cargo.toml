[workspace]
resolver = "2"
members = ["crates/lane-core", "crates/lane-cli", "crates/lane-desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
base64 = "0.22"
futures-util = "0.3"
subtle = "2"
tempfile = "3"
if-addrs = "0.13"
httpdate = "1"
mime_guess = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
