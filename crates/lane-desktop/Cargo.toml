[package]
name = "lane-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Windows desktop application for LANE local file sharing"
publish = false

[lib]
name = "lane_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `custom-protocol` 只在 `tauri build` 时由 CLI 自动启用（内嵌前端资源）；
# `tauri dev` 用 `--no-default-features` 关闭它，从而走 devUrl（vite + HMR）。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
lane-core = { path = "../lane-core" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
