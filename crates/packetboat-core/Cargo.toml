[package]
name = "packetboat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Core LAN file transfer, pairing, catalog, and HTTP server for PacketBoat"
publish = false

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
subtle = { workspace = true }
tempfile = { workspace = true }
if-addrs = { workspace = true }
httpdate = { workspace = true }
mime_guess = { workspace = true }
fs2 = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-util = { workspace = true }
async-stream = "0.3"
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] }
futures-lite = "2"
notify = "8"
zip = "2"
multer = "3"
http-range-header = "0.4"
tracing = { workspace = true }
sha2 = { workspace = true }
rust-embed = "8"
# 可选：为桌面端的前后端类型生成导出 specta::Type 实现
specta = { version = "2.0.0-rc.25", features = ["derive", "chrono"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "stream"] }
flate2 = "1"

[[bench]]
name = "transfer"
harness = false
