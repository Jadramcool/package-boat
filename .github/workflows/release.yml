name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersions = @(
            $metadata.packages |
              Where-Object { $metadata.workspace_members -contains $_.id } |
              Select-Object -ExpandProperty version -Unique
          )
          # tauri.conf.json 省略 version 时自动继承 Cargo 包版本，无需单独校验
          $uiVersion = (Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json).version
          $versions = @(@($cargoVersions) + $uiVersion | Sort-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tagVersion) {
            throw "Tag $tagVersion does not match project versions: $($versions -join ', ')"
          }
      - name: Clean previous bundles
        shell: pwsh
        run: Remove-Item "target/release/bundle" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build Windows installer
        run: pnpm run build:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Package artifacts and checksums
        shell: pwsh
        run: |
          $bundleDir = Join-Path $PWD "target/release/bundle"
          $assets = @(Get-ChildItem "target/release/bundle/nsis/*.exe" -File)
          if ($assets.Count -lt 1) {
            throw "Expected an NSIS installer"
          }
          $sigFiles = @(Get-ChildItem "target/release/bundle/nsis/*.exe.sig" -File)
          if ($sigFiles.Count -lt 1) {
            throw "Expected an updater signature file"
          }

          # 自动更新清单：客户端 endpoint 指向 releases/latest/download/latest.json
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $exe = $assets[0]
          $signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($exe.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = "PacketBoat $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifestPath = Join-Path $bundleDir "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding utf8

          $checksumPath = Join-Path $bundleDir "SHA256SUMS.txt"
          $checksums = $assets | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines($checksumPath, $checksums)

          $releaseAssets = @($assets.FullName) + @($sigFiles.FullName) + @($checksumPath, $manifestPath)
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes $releaseAssets
        env:
          GH_TOKEN: ${{ github.token }}
