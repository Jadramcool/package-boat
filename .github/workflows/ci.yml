name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify version consistency
        run: node scripts/check-versions.mjs

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          # build.rs 的 /MANIFEST:EMBED workaround（tao 测试二进制需要 comctl32 v6
          # manifest）会让链接器调用 Windows SDK 的 mt.exe，确保它在 PATH 中
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'mt.exe') } |
            Select-Object -First 1
          if ($sdkBin) { $env:PATH = "$sdkBin;$env:PATH" }
          cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check dependencies (licenses, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Verify embedded browser assets are current
        run: git diff --exit-code -- crates/packetboat-core/assets/dist

  desktop-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 编译并解析 tauri.conf.json 与 capabilities，跳过安装包打包以控制时长
      - name: Validate Tauri build (no bundle)
        run: pnpm run build:desktop:check
