<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- PacketBoat · PB-05 私域航迹 · 颜色锁定版（品牌应用） -->
  <!-- 底板：深海墨圆角方 -->
  <rect width="100" height="100" rx="22" fill="#1f271c"/>
  <!-- 私域环 -->
  <circle cx="50" cy="52" r="26" fill="none" stroke="#d7f954" stroke-width="1.8" stroke-dasharray="4 3.5" opacity="0.28"/>
  <!-- 主航迹 -->
  <path d="M28 64 C38 64 42 38 50 38 C58 38 62 64 72 64"
        fill="none" stroke="#d7f954" stroke-width="5" stroke-linecap="round"/>
  <!-- 尾迹 -->
  <path d="M34 74 C41 74 45 50 50 50 C55 50 59 74 66 74"
        fill="none" stroke="#d7f954" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- 主机节点 -->
  <circle cx="28" cy="64" r="6.5" fill="#d7f954"/>
  <!-- 客户端节点 -->
  <circle cx="72" cy="64" r="5" fill="#d7f954"/>
  <!-- 载荷菱形 -->
  <path d="M50 28 L56 38 L50 48 L44 38 Z" fill="#d7f954"/>
</svg>
